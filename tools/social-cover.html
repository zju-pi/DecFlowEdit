<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>DecFlowEdit social cover</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; }
    body { background: #f3f7f4; color: #172d29; font-family: Arial, Helvetica, sans-serif; }
    .cover { width: 1200px; height: 630px; padding: 32px 40px 28px; border-top: 6px solid #075e50; }
    header { display: flex; justify-content: space-between; align-items: center; height: 110px; margin-bottom: 20px; }
    h1 { margin: 0 0 5px; color: #075e50; font-size: 66px; line-height: 1; letter-spacing: -2.8px; font-weight: 750; }
    .subtitle { margin: 0; font-size: 23px; line-height: 1.3; letter-spacing: -.3px; }
    .idea { border-left: 2px solid #a9c7bb; padding-left: 27px; width: 397px; }
    .idea p { margin: 0; font-family: Georgia, serif; font-size: 27px; line-height: 1.25; }
    .idea small { display: block; color: #52665f; margin-top: 9px; font-size: 15px; letter-spacing: .25px; }
    .comparison { display: grid; grid-template-columns: repeat(3, 352px); gap: 32px; }
    figure { margin: 0; }
    figcaption { display: flex; align-items: center; height: 30px; margin-bottom: 8px; font-size: 23px; font-weight: 600; }
    figcaption span { margin-left: 8px; font-size: 18px; font-weight: 400; }
    img { display: block; width: 352px; height: 352px; object-fit: contain; outline: 1px solid #c7d7cf; }
    .image-panel { position: relative; width: 352px; height: 352px; }
    .cat-box { position: absolute; left: 38.28125%; top: 36.328125%; width: 48.4375%; height: 60.15625%; border: 3px solid #df3333; pointer-events: none; }
    .ours figcaption { color: #075e50; }
    .ours img { outline: 3px solid #075e50; }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 19px; font-size: 18px; line-height: 24px; }
    footer p { margin: 0; }
    .prompt-label { color: #52665f; margin-right: 8px; }
    .prompt strong { color: #075e50; }
    .context { color: #52665f; }
    .annotation-note { color: #a22b2b; font-size: 16px; }
  </style>
</head>
<body>
  <main class="cover">
    <header>
      <div>
        <h1>DecFlowEdit</h1>
        <p class="subtitle">Self-localized image editing via guidance decoupling</p>
      </div>
      <div class="idea">
        <p>Localize without CFG.<br>Edit with default CFG.</p>
        <small>Training-free · Inversion-free</small>
      </div>
    </header>
    <section class="comparison" aria-label="Goat-to-horse editing comparison with the neighboring cat highlighted">
      <figure>
        <figcaption>Source</figcaption>
        <div class="image-panel">
          <img src="../docs/assets/social/goat-cat/source.jpg" alt="Source image: a goat and a cat on rocks by the sea" width="352" height="352">
          <span class="cat-box" aria-hidden="true"></span>
        </div>
      </figure>
      <figure>
        <figcaption>FlowEdit</figcaption>
        <div class="image-panel">
          <img src="../docs/assets/social/goat-cat/flowedit-flux.png" alt="FlowEdit replaces the goat with a horse and also changes the neighboring cat, using FLUX.1-dev" width="352" height="352">
          <span class="cat-box" aria-hidden="true"></span>
        </div>
      </figure>
      <figure class="ours">
        <figcaption>DecFlowEdit <span>(ours)</span></figcaption>
        <div class="image-panel">
          <img src="../docs/assets/social/goat-cat/decflowedit-flux.png" alt="DecFlowEdit replaces the goat with a horse while better preserving the neighboring cat, using FLUX.1-dev" width="352" height="352">
          <span class="cat-box" aria-hidden="true"></span>
        </div>
      </figure>
    </section>
    <footer>
      <p class="prompt"><span class="prompt-label">Edit</span>Replace the <strong>goat</strong> with a <strong>horse</strong></p>
      <p class="annotation-note">Red boxes: preserve the cat</p>
      <p class="context">PIE-Bench · FLUX.1-dev</p>
    </footer>
  </main>
</body>
</html>
